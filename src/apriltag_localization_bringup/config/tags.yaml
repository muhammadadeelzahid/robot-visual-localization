# AprilTag world map.
#
# Each tag frame has its origin at the tag centre, +x right, +y up and +z out of
# the printed face. position is the tag centre in the map frame; orientation is a
# quaternion [x, y, z, w]. This file drives the pose estimator, the RViz markers
# and the simulated world, so all three stay consistent.

frame_id: map
default_size: 0.4

tags:
  - id: 0
    size: 0.4
    position: [3.0, 0.0, 0.5]
    orientation: [0.5, -0.5, -0.5, 0.5]      # on +x wall, facing -x
  - id: 1
    size: 0.4
    position: [-3.0, 0.0, 0.5]
    orientation: [0.5, 0.5, 0.5, 0.5]        # on -x wall, facing +x
  - id: 2
    size: 0.4
    position: [0.0, 3.0, 0.5]
    orientation: [0.707107, 0.0, 0.0, 0.707107]   # on +y wall, facing -y
  - id: 3
    size: 0.4
    position: [0.0, -3.0, 0.5]
    orientation: [0.0, 0.707107, 0.707107, 0.0]   # on -y wall, facing +y
